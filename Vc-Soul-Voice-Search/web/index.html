<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.O.U.L — System of Universal Listening</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <!-- Vanta.js Background Container -->
    <div id="vanta-bg"></div>

    <div class="app-container">
        <!-- Top Status Bar -->
        <header class="top-bar">
            <div class="top-left-group">
                <button class="btn-settings" onclick="toggleSettingsModal()" title="System Settings">⚙️</button>
                <div class="status-indicator">
                    <span class="dot" id="status-dot"></span>
                    <span id="status-text">Waiting for you to say 'Hello Bro'...</span>
                </div>
            </div>
            <div class="time-container">
                <div id="live-time">--:--:--</div>
                <div id="live-date">-- --, ----</div>
            </div>
            <button class="btn-chat" onclick="quickAction('hello bro')" title="Personal Chat">🪽</button>
        </header>

        <!-- Main Display (Orb + Text) -->
        <main class="main-display">
            <div class="orb-container" id="orb-container" onclick="manualActivate()">
                <div class="blob blob-cyan"></div>
                <div class="blob blob-purple"></div>
                <div class="blob blob-blue"></div>
            </div>
            <div class="main-text-container">
                <h1 id="main-text">How can I help?</h1>
                <div id="ai-response-container" style="display: none;">
                    <p id="ai-text"></p>
                    <div id="ai-images" class="ai-images-grid"></div>
                </div>
            </div>
        </main>

        <!-- Bottom Controls -->
        <footer class="bottom-bar">
            <div class="suggestions">
                <button class="suggestion-btn" onclick="quickAction('Build Box')">Build Box</button>
                <button class="suggestion-btn" onclick="quickAction('Suggestion of plan')">Suggestion of plan</button>
                <button class="suggestion-btn" onclick="quickAction('Help me code')">Help me code</button>
                <button class="suggestion-btn" onclick="quickAction('Open ChatGPT')">Open ChatGPT</button>
            </div>
            <div class="input-container">
                <span class="input-icon">▶</span>
                <input type="text" id="command-input" placeholder="Type a command...">
            </div>
        </footer>
    </div>
    
    <!-- Live Weather Widget (Bottom Left) -->
    <div id="weather-widget" class="weather-widget">
        <div class="weather-header">
            <span class="weather-title">LIVE WEATHER</span>
            <span class="weather-dot"></span>
        </div>
        <div class="weather-body">
            <div id="weather-emoji" class="weather-emoji">🌤️</div>
            <div class="weather-info">
                <div id="weather-temp" class="weather-temp">--°C</div>
                <div id="weather-desc" class="weather-desc">Loading...</div>
                <div id="weather-loc" class="weather-loc">Detecting...</div>
            </div>
        </div>
    </div>

    <!-- Settings Modal (Glassmorphic Popup) -->
    <div id="settings-modal" class="settings-modal" style="display: none;">
        <div class="settings-modal-content">
            <div class="settings-header">
                <h2>⚙️ SYSTEM SETTINGS</h2>
                <button class="btn-close-settings" onclick="toggleSettingsModal()">×</button>
            </div>
            <div class="settings-body">
                <div class="setting-item">
                    <label>AI Intelligence Mode</label>
                    <select id="setting-ai-mode" onchange="updateSetting('ai_mode', this.value)">
                        <option value="hybrid">Hybrid (Online + Wikipedia Fallback)</option>
                        <option value="offline">Offline Local Phi-3 Only</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>HUD Color Palette</label>
                    <select id="setting-theme" onchange="updateTheme(this.value)">
                        <option value="violet">Neon Violet (Default)</option>
                        <option value="cyan">Cyber Cyan</option>
                        <option value="emerald">Emerald AI</option>
                        <option value="crimson">Crimson Core</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Wake Word Listening</label>
                    <div class="toggle-switch" onclick="toggleWakeWord()">
                        <span id="wake-word-status" class="toggle-label status-active">ACTIVE</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label>System Logs</label>
                    <button class="btn-log" onclick="quickAction('Logs')">📂 Open soul.log</button>
                </div>
            </div>
            <div class="settings-footer">
                <p>S.O.U.L. v0.2 — System of Universal Listening</p>
            </div>
        </div>
    </div>

    <!-- Vanta.js CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.net.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
